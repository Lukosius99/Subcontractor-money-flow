name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "db-backups/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PADS.MoneyFlow.Api.csproj

      - name: Verify formatting
        run: dotnet format PADS.MoneyFlow.Api.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PADS.MoneyFlow.Api.csproj -c Release --no-restore

      - name: Verify production package
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'moneyflow-publish'
          dotnet publish PADS.MoneyFlow.Api.csproj -c Release -r win-x64 --self-contained false -o $output --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Production publish failed' }
          $forbidden = @(
            'appsettings.example.json',
            'global.json',
            'PADS.MoneyFlow.Api.pdb',
            'publish',
            'db-backups',
            'tests'
          )
          foreach ($name in $forbidden) {
            if (Test-Path (Join-Path $output $name)) { throw "Forbidden publish content: $name" }
          }
          foreach ($required in @('PADS.MoneyFlow.Api.exe', 'Set-MoneyFlowApiKey.ps1', 'Set-MoneyFlowBackupPassphrase.ps1', 'wwwroot\index.html')) {
            if (-not (Test-Path (Join-Path $output $required))) { throw "Missing publish content: $required" }
          }

      - name: Reject unencrypted database files
        shell: pwsh
        run: |
          $rawDatabases = @(git ls-files 'db-backups/*.db' 'db-backups/*.sqlite' 'db-backups/*.sqlite3')
          if ($rawDatabases.Count -gt 0) {
            throw "Unencrypted database tracked in Git: $($rawDatabases -join ', ')"
          }

      - name: Check vulnerable packages
        run: dotnet list PADS.MoneyFlow.Api.csproj package --vulnerable --include-transitive

      - name: Parse JavaScript
        shell: pwsh
        run: |
          Get-ChildItem wwwroot,docs -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript parse failed: $($_.FullName)" }
          }

      - name: Run integration checks
        shell: pwsh
        run: .\Run-Tests.ps1
